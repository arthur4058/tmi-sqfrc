  <style>.h{font:700 28px 'Microsoft YaHei',sans-serif;fill:#0f172a}.t{font:600 18px 'Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:400 15px 'Microsoft YaHei',sans-serif;fill:#475569}.axis{stroke:#64748b;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}.b0{stroke:#64748b;stroke-width:4;fill:none}.v{stroke:#ea580c;stroke-width:4;fill:none}.db{fill:#64748b}.dv{fill:#ea580c}</style>
